name: Exp 9 - CI and CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  unit-and-api-tests:
    name: Unit and API Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit, MockMvc and Pact contract tests
        run: mvn -B test

  container-integration-test:
    name: Testcontainers Database Test
    runs-on: ubuntu-latest
    needs: unit-and-api-tests
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run PostgreSQL Testcontainers test
        run: mvn -B -Dtest=PostgresContainerTest test

  build-and-publish:
    name: Build and Publish Docker Image (CD)
    runs-on: ubuntu-latest
    needs: [unit-and-api-tests, container-integration-test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/exp9-ci-cd-pipeline:${{ github.sha }}

  canary-release:
    name: Canary Release Plan
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: canary
    steps:
      - name: Explain canary release artifact
        run: |
          echo "Canary image published:"
          echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/exp9-ci-cd-pipeline:${GITHUB_SHA}"
          echo "This job marks the canary release stage."
          echo "For a real server deployment, add deployment host credentials as GitHub Actions Secrets"
          echo "and replace this step with a deployment command for your chosen hosting platform."
