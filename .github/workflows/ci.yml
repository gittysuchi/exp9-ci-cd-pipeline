# =====================================================================================
#  CONTINUOUS INTEGRATION (CI)
#  Goal   : every push / pull request is automatically built and tested.
#  Answers: "Does the new code compile, and does it still work with the rest of the system?"
#  Stops  : at a verified build artifact (JAR). Deployment is the job of cd.yml.
# =====================================================================================
name: "CI - Build and Test Pipeline"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# a newer push cancels the older run of the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  # ---------------------------------------------------------------- 1. BUILD
  build:
    name: "1. Build and Compile"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compile main and test sources
        run: mvn -B -ntp -DskipTests clean test-compile

  # ---------------------------------------------------------------- 2. UNIT TESTS
  unit-tests:
    name: "2. Unit Tests (JUnit 5 + Mockito)"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit tests
        run: mvn -B -ntp -Dtest=ProductServiceTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Publish test summary
        if: always()
        run: bash scripts/test-summary.sh "Unit tests (JUnit 5 + Mockito)"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: target/surefire-reports/

  # ---------------------------------------------------------------- 3. API / INTEGRATION TESTS
  api-tests:
    name: "3. API and Integration Tests (MockMvc)"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run MockMvc web-layer and full-context integration tests
        run: mvn -B -ntp -Dtest='ProductControllerTest,ProductApiIntegrationTest' -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Publish test summary
        if: always()
        run: bash scripts/test-summary.sh "API and integration tests (MockMvc)"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: target/surefire-reports/

  # ---------------------------------------------------------------- 4. TESTCONTAINERS
  testcontainers:
    name: "4. Infrastructure Tests (Testcontainers - PostgreSQL)"
    needs: build
    runs-on: ubuntu-latest        # Docker is pre-installed on GitHub-hosted Ubuntu runners
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run tests against a real PostgreSQL container
        run: mvn -B -ntp -Dtest=ProductPostgresContainerTest -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Publish test summary
        if: always()
        run: bash scripts/test-summary.sh "Testcontainers (PostgreSQL)"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testcontainers-reports
          path: target/surefire-reports/

  # ---------------------------------------------------------------- 5. CONTRACT TESTS
  contract-tests:
    name: "5. Contract Tests (Pact - frontend vs backend)"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Consumer test (writes the pact) then provider verification
        run: mvn -B -ntp -Dtest='ProductConsumerPactTest,ProductProviderPactTest' -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Publish test summary
        if: always()
        run: bash scripts/test-summary.sh "Contract tests (Pact)"

      - name: Upload pact contract and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: |
            src/test/resources/pacts/
            target/surefire-reports/

  # ---------------------------------------------------------------- 6. PACKAGE
  package:
    name: "6. Package JAR and Code Coverage"
    needs: [ unit-tests, api-tests, testcontainers, contract-tests ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Full verify (all tests + JaCoCo coverage + executable JAR)
        run: mvn -B -ntp verify

      - name: Publish test summary
        if: always()
        run: bash scripts/test-summary.sh "Full test suite"

      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/

  # ---------------------------------------------------------------- 7. GATE
  ci-gate:
    name: "7. CI Gate - all checks passed"
    needs: [ build, unit-tests, api-tests, testcontainers, contract-tests, package ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate pipeline result
        run: |
          echo "build=${{ needs.build.result }}"
          echo "unit-tests=${{ needs.unit-tests.result }}"
          echo "api-tests=${{ needs.api-tests.result }}"
          echo "testcontainers=${{ needs.testcontainers.result }}"
          echo "contract-tests=${{ needs.contract-tests.result }}"
          echo "package=${{ needs.package.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "### :x: CI failed - nothing will be deployed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### :white_check_mark: CI passed - the CD pipeline can start" >> "$GITHUB_STEP_SUMMARY"
