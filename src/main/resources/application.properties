spring.application.name=cicd-pipeline-demo
server.port=8080

# In-memory database keeps the demo self-contained (Testcontainers swaps in PostgreSQL during tests)
spring.datasource.url=jdbc:h2:mem:productsdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Actuator (used by Docker HEALTHCHECK and the canary gateway)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Release metadata - injected by Docker / the CD workflow through environment variables
app.version=${APP_VERSION:1.0.0}
app.track=${APP_TRACK:local}
app.simulate-failure=${APP_SIMULATE_FAILURE:false}

# Demo data
app.seed.enabled=true
