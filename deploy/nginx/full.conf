# FULL ROLLOUT: 100 % of traffic goes to the new release (the "canary" container, now promoted)
upstream app {
    server canary:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
