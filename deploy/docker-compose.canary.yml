# Canary release topology:
#
#   client --> gateway (nginx :8080) --90%--> stable  (previous release)
#                                    \-10%--> canary  (new release)
#
# Variables are supplied by deploy/canary-deploy.sh / the CD workflow.
services:
  stable:
    image: ${STABLE_IMAGE:?STABLE_IMAGE is required}
    environment:
      APP_TRACK: stable
      APP_VERSION: ${STABLE_VERSION:-stable}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  canary:
    image: ${CANARY_IMAGE:?CANARY_IMAGE is required}
    environment:
      APP_TRACK: canary
      APP_VERSION: ${CANARY_VERSION:-canary}
      # true => every /api call returns HTTP 500 (used to demonstrate automatic rollback)
      APP_SIMULATE_FAILURE: ${CANARY_FAIL:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/${NGINX_CONF:-canary.conf}:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      stable:
        condition: service_healthy
      canary:
        condition: service_healthy
